# On-premise or VPS deployment with automatic HTTPS for your domain.
# 1. Point your domain's DNS A record at this server.  2. Copy .env.example to .env and fill it in.
# 3. Set WAYMED_DOMAIN in .env (e.g. waymed.example.org).  4. docker compose up -d
services:
  waymed:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/waymed.db
    volumes:
      - waymed-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      WAYMED_DOMAIN: ${WAYMED_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [waymed]
volumes:
  waymed-data:
  caddy-data:
