# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create waymed_data --size 1`,
# `fly secrets set SESSION_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=...`, then `fly deploy`.
# Custom domain: `fly certs add waymed.example.org` and point DNS as instructed.
app = "waymed"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/waymed.db"

[mounts]
  source = "waymed_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Live updates keep connections open; keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
